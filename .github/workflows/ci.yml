name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jorgen/vio-ci

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag from Dockerfile
        id: tag
        run: echo "tag=sha-$(sha256sum Dockerfile | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check
        run: |
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

      - name: Move latest to this image
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}

  linux:
    needs: docker
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jorgen/vio-ci:${{ needs.docker.outputs.image-tag }}
      options: --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-debug
            cc: gcc-14
            cxx: g++-14
            c_flags: ""
            cxx_flags: ""
            linker_flags: ""
            options: ""
            header_check: true
          - name: linux-shared
            cc: gcc-14
            cxx: g++-14
            c_flags: ""
            cxx_flags: ""
            linker_flags: ""
            options: -DVIO_BUILD_SHARED=ON
            tests: build/bin/vio_tests
          - name: asan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=address -fno-omit-frame-pointer
            cxx_flags: -fsanitize=address -fno-omit-frame-pointer
            linker_flags: -fsanitize=address
          - name: tsan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=thread -fno-omit-frame-pointer
            cxx_flags: -fsanitize=thread -fno-omit-frame-pointer
            linker_flags: -fsanitize=thread
          - name: ubsan
            cc: gcc-14
            cxx: g++-14
            c_flags: -fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
            cxx_flags: -fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
            linker_flags: -fsanitize=undefined
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache 3rdparty dependencies
        uses: actions/cache@v4
        with:
          path: 3rdparty
          key: 3rdparty-${{ runner.os }}-${{ hashFiles('CMake/3rdPartyPackages.cmake', 'CMakeLists.txt') }}
          restore-keys: 3rdparty-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          ccache --zero-stats
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_FLAGS="${{ matrix.c_flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}" \
            ${{ matrix.options }}

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake --build build
          ccache --show-stats

      - name: Compile every public header without exceptions or RTTI
        if: matrix.header_check
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build --target vio_header_check

      - name: Test on epoll
        env:
          VIO_BACKEND: epoll
        shell: bash
        run: |
          set -o pipefail
          ./${{ matrix.tests || 'build/test/vio_tests' }} 2>&1 | tee test-epoll.log || { grep -n -A12 -E "ERROR|FATAL|CRASHED|ThreadSanitizer|AddressSanitizer" test-epoll.log | head -400; exit 1; }

      - name: Test on io_uring
        env:
          VIO_BACKEND: io_uring
        shell: bash
        run: |
          set -o pipefail
          ./${{ matrix.tests || 'build/test/vio_tests' }} 2>&1 | tee test-io_uring.log || { grep -n -A12 -E "ERROR|FATAL|CRASHED|ThreadSanitizer|AddressSanitizer" test-io_uring.log | head -400; exit 1; }

  install:
    needs: docker
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jorgen/vio-ci:${{ needs.docker.outputs.image-tag }}
    name: install-and-consume
    env:
      PREFIX: /tmp/vio-prefix
    steps:
      - uses: actions/checkout@v4

      - name: Cache 3rdparty dependencies
        uses: actions/cache@v4
        with:
          path: 3rdparty
          key: 3rdparty-${{ runner.os }}-${{ hashFiles('CMake/3rdPartyPackages.cmake', 'CMakeLists.txt') }}
          restore-keys: 3rdparty-${{ runner.os }}-

      - name: Fetch the pinned dependency sources
        run: |
          cmake -G Ninja -B fetch -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DVIO_BUILD_TESTS=OFF -DVIO_BUILD_EXAMPLES=OFF

      - name: Install BoringSSL and ada
        shell: bash
        run: |
          set -e
          boringssl=$(ls -d 3rdparty/boringssl-*)
          ada=$(ls -d 3rdparty/ada-*)
          cmake -G Ninja -S "$boringssl" -B deps/boringssl -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build deps/boringssl --target crypto ssl bssl
          cmake --install deps/boringssl
          cmake -G Ninja -S "$ada" -B deps/ada -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DADA_TESTING=OFF -DADA_TOOLS=OFF -DADA_BENCHMARKS=OFF -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build deps/ada
          cmake --install deps/ada

      - name: Build and install vio against them
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DVIO_USE_SYSTEM_BORINGSSL=ON -DVIO_USE_SYSTEM_ADA=ON \
            -DVIO_BUILD_TESTS=OFF -DVIO_BUILD_EXAMPLES=OFF \
            -DCMAKE_PREFIX_PATH="$PREFIX" -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build build
          cmake --install build
          test -f "$PREFIX/lib/cmake/vio/vioConfig.cmake"

      - name: Build and run a find_package(vio) consumer
        run: |
          cmake -G Ninja -S test/install_consumer -B consumer -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build consumer
          ctest --test-dir consumer --output-on-failure

  wasm:
    runs-on: ubuntu-24.04
    name: wasm
    env:
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v4

      - name: Install emsdk
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          source ./emsdk/emsdk_env.sh
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build

      - name: Test
        run: |
          source ./emsdk/emsdk_env.sh
          node build/vio_wasm_smoke.js

  macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-debug
            cxx_flags: ""
            linker_flags: ""
            header_check: true
          - name: macos-asan
            cxx_flags: -fsanitize=address -fno-omit-frame-pointer
            linker_flags: -fsanitize=address
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install tools
        run: brew install ninja ccache

      - name: Cache 3rdparty dependencies
        uses: actions/cache@v4
        with:
          path: 3rdparty
          key: 3rdparty-${{ runner.os }}-${{ hashFiles('CMake/3rdPartyPackages.cmake', 'CMakeLists.txt') }}
          restore-keys: 3rdparty-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build

      - name: Compile every public header without exceptions or RTTI
        if: matrix.header_check
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build build --target vio_header_check

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ./build/test/vio_tests 2>&1 | tee test.log || { grep -n -A12 -E "ERROR|FATAL|CRASHED|AddressSanitizer" test.log | head -400; exit 1; }

  windows-msvc:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [debug-msvc, msvc-asan]
    name: ${{ matrix.preset }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache 3rdparty dependencies
        uses: actions/cache@v4
        with:
          path: 3rdparty
          key: 3rdparty-${{ runner.os }}-${{ hashFiles('CMake/3rdPartyPackages.cmake', 'CMakeLists.txt') }}
          restore-keys: 3rdparty-${{ runner.os }}-

      # BoringSSL assembles its x86-64 crypto with NASM, and stops rather than
      # quietly building without AES-NI when no assembler is there. Go, which it
      # also needs, is already on the runner image.
      - name: Install NASM
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # vcvars64.bat only affects the process it runs in, so configure, build
      # and test share one step. vswhere lives at a fixed path independent of
      # the installed VS version; %ProgramFiles(x86)% is read into a variable
      # first because its parentheses confuse cmd inside a for /f block.
      - name: Configure, build and test
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (echo vswhere.exe not found at "%VSWHERE%" & exit /b 1)
          "%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > "%RUNNER_TEMP%\vspath.txt"
          set /p VSPATH=<"%RUNNER_TEMP%\vspath.txt"
          if not defined VSPATH (echo no Visual Studio with the C++ toolchain & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ctest --preset ${{ matrix.preset }} --output-on-failure > test.log 2>&1 || (findstr /n /c:"ERROR" /c:"FATAL" /c:"CRASHED" test.log & powershell -NoProfile -Command "Get-Content test.log -Tail 300" & exit /b 1)
